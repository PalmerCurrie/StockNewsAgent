name: Stock News Agent

# HOW THE TIMING WORKS, AND WHY IT IS NOT A CRON
#
# GitHub's `schedule` trigger cannot hit a target time. It queues scheduled
# workflows and creates the run when it has capacity, and the delay is neither
# small nor something you can subtract out. Measured on this repo:
#
#   cron (UTC)   fired (UTC)              late by
#   14:00        16:00, 16:04             2h00, 2h04
#   14:50        16:11, 16:16, 16:26      1h21, 1h26, 1h36
#   20:50        21:40, 21:49, 21:48      0h50, 0h59, 0h58
#
# Note the second block against the first: moving the cron 50 minutes LATER
# moved the actual fire time only ~15 minutes later. The delay is not a
# constant, so "ask earlier to compensate" does not work -- an earlier cron on
# a day the queue happens to be quick just delivers at the wrong hour. Three
# days at `:50` delivered at 09:14, 09:22 and 09:31 PT against an 08:00 target.
#
# So the schedule below is NOT the primary trigger. It is a fallback.
#
# PRIMARY: an external scheduler calls the workflow_dispatch API at 07:45 and
# 13:45 PT. A dispatched run is created the instant the API call lands -- there
# is no queue to wait behind -- so the fire time is exact. It passes deliver_at,
# and the agent holds the finished alert until that wall-clock minute, which
# absorbs the 2-8 minute spread in how long a run takes. Net effect: the news is
# fetched at 07:45 and the message arrives at 08:00:00.
#
# Because deliver_at is timezone-aware ("08:00 America/Los_Angeles"), DST needs
# no seasonal edit. The old chore of adding 1 to each hour field every November
# is gone -- schedule the external trigger in America/Los_Angeles too and both
# ends follow DST on their own.
#
# FALLBACK: the crons below exist only so that a dead external trigger produces
# a late alert rather than silence. They pass no deliver_at, so they dispatch as
# soon as they finish. On a normal day the primary run has already sent
# everything and cross-run dedup makes the fallback a quiet no-op, which is why
# it is cheap to leave on. If you start seeing fallback runs actually deliver,
# the external trigger has stopped firing.
on:
  schedule:
    - cron: "30 16 * * 1-5" # fallback for the 08:00 PT run; lands mid-morning PT
    - cron: "30 22 * * 1-5" # fallback for the 14:00 PT run; lands late afternoon PT
  workflow_dispatch:
    inputs:
      deliver_at:
        description: "Hold the alert until this local time, HH:MM (empty = send as soon as ready)"
        required: false
        default: ""
      deliver_tz:
        description: "IANA timezone for deliver_at"
        required: false
        default: "America/Los_Angeles"
      extra_args:
        description: "Extra CLI args (e.g. --test-channels, --dry-run)"
        required: false
        default: ""

# First line of defence against overlapping runs (e.g. a fallback cron firing
# while a dispatched run is still holding its alert). The `run_lock` record in
# the State_Store is still the authoritative guard -- `concurrency` only covers
# GitHub Actions. The lock TTL is raised to cover the hold; see agent.py.
concurrency:
  group: stock-news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Longest observed run is ~7.5 min; the delivery hold adds at most 30 min
    # (MAX_HOLD_SECONDS in agent/time_gate.py). 45 leaves room for both.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the agent
        run: python -m agent.main $EXTRA_ARGS
        env:
          # Passed through the environment rather than interpolated into the
          # `run:` script, so a dispatch input cannot inject shell.
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}

          # Empty on a scheduled (fallback) run, because `schedule` carries no
          # inputs -- and empty means "no hold, send as soon as the run
          # finishes", which is what a fallback should do. Only a dispatched
          # run sets a target.
          AGENT_DELIVER_AT: ${{ github.event.inputs.deliver_at }}
          AGENT_DELIVER_TZ: ${{ github.event.inputs.deliver_tz }}

          # Optional repository VARIABLES (Settings -> Secrets and variables ->
          # Actions -> Variables), not secrets. Unset means empty, which the
          # config loader ignores, so the config.yaml values apply.
          # Set both to 00:00 / 23:59 to run a live test outside market hours.
          AGENT_ACTIVE_HOURS_START: ${{ vars.AGENT_ACTIVE_HOURS_START }}
          AGENT_ACTIVE_HOURS_END: ${{ vars.AGENT_ACTIVE_HOURS_END }}
          AGENT_IMPACT_THRESHOLD: ${{ vars.AGENT_IMPACT_THRESHOLD }}

          # Which Notion database holds the watchlist. Not a secret (it is
          # useless without NOTION_API_TOKEN), but it is per-user, so it lives
          # in a repository variable rather than in the committed config.yaml.
          AGENT_NOTION_DATABASE_ID: ${{ vars.AGENT_NOTION_DATABASE_ID }}

          # All of these are repository secrets
          # (Settings -> Secrets and variables -> Actions). Never commit them.
          # Default LLM provider. OPENAI_API_KEY is only read when
          # llm_provider is set to "openai" in config.yaml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          # Required: runners have no persistent disk, so state must be
          # external. A free Upstash Redis database is enough.
          STATE_STORE_REDIS_URL: ${{ secrets.STATE_STORE_REDIS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
