name: Stock News Agent
#
# OPTIONAL. Running on GitHub Actions is one deployment choice, not the
# supported path -- see "Scheduling" in the README. Two things to know before
# you enable it:
#
#   1. Runners have no disk that survives a run, so the default sqlite state
#      store cannot remember what it already alerted on. This workflow sets
#      AGENT_STATE_STORE_TYPE=redis; supply STATE_STORE_REDIS_URL (a free
#      Upstash database is enough). Without it you get the same story every run.
#
#   2. On a PUBLIC repo, Actions logs are public. The run summary lists every
#      ticker processed. Keep the deployment private if your watchlist is not
#      something you want indexed.
#
# TIMING: GitHub's `schedule` trigger cannot hit a target time. It queues
# scheduled workflows and creates the run when it has capacity. Measured on
# this project:
#
#   cron (UTC)   fired (UTC)              late by
#   14:00        16:00, 16:04             2h00, 2h04
#   14:50        16:11, 16:16, 16:26      1h21, 1h26, 1h36
#   20:50        21:40, 21:49, 21:48      0h50, 0h59, 0h58
#
# Read the second block against the first: moving a cron 50 minutes LATER moved
# the actual fire time only ~15 minutes. The delay is not a constant, so
# "ask earlier to compensate" does not work.
#
# A `workflow_dispatch` run has no such queue -- it is created the instant the
# API call lands. So if you need the alert at a specific minute, have something
# outside GitHub POST to the dispatch API and pass `deliver_at`; the agent
# fetches immediately and holds the finished alert until that wall-clock
# minute. `triggers/railway/` is a worked example. The crons below are then a
# fallback: they pass no deliver_at, so a dead trigger yields a late alert
# rather than silence, and cross-run dedup makes them a quiet no-op otherwise.
on:
  schedule:
    - cron: "50 12 * * 1-5"
    - cron: "50 18 * * 1-5"
  workflow_dispatch:
    inputs:
      deliver_at:
        description: "Hold the alert until this local time, HH:MM (empty = send as soon as ready)"
        required: false
        default: ""
      deliver_tz:
        description: "IANA timezone for deliver_at"
        required: false
        default: "America/New_York"
      extra_args:
        description: "Extra CLI args (e.g. --test-channels, --dry-run)"
        required: false
        default: ""

# First line of defence against overlapping runs (e.g. a fallback cron firing
# while a dispatched run is still holding its alert). The `run_lock` record in
# the state store is still the authoritative guard -- `concurrency` only covers
# GitHub Actions.
concurrency:
  group: stock-news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A run is typically 1-8 minutes; the delivery hold adds at most 30
    # (MAX_HOLD_SECONDS in agent/time_gate.py). 45 leaves room for both.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # redis is commented out of requirements.txt because it is only needed on
      # a host with no disk, which is exactly what this is.
      - run: pip install -r requirements.txt redis

      - name: Write the watchlist
        # Kept in a repository variable rather than committed, so a public repo
        # does not publish your tickers. Settings -> Secrets and variables ->
        # Actions -> Variables -> AGENT_WATCHLIST, one `- TICKER` per line.
        run: printf '%s\n' "$AGENT_WATCHLIST" > watchlist.yaml
        env:
          AGENT_WATCHLIST: ${{ vars.AGENT_WATCHLIST }}

      - name: Run the agent
        run: python -m agent.main $EXTRA_ARGS
        env:
          # Passed through the environment rather than interpolated into the
          # `run:` script, so a dispatch input cannot inject shell.
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}

          # Empty on a scheduled (fallback) run, because `schedule` carries no
          # inputs -- and empty means "no hold, send as soon as the run
          # finishes", which is what a fallback should do.
          AGENT_DELIVER_AT: ${{ github.event.inputs.deliver_at }}
          AGENT_DELIVER_TZ: ${{ github.event.inputs.deliver_tz }}

          # Runners have no persistent disk; see the note at the top.
          AGENT_STATE_STORE_TYPE: redis
          STATE_STORE_REDIS_URL: ${{ secrets.STATE_STORE_REDIS_URL }}

          # Optional non-secret overrides (Variables tab, not Secrets).
          AGENT_ACTIVE_HOURS_START: ${{ vars.AGENT_ACTIVE_HOURS_START }}
          AGENT_ACTIVE_HOURS_END: ${{ vars.AGENT_ACTIVE_HOURS_END }}
          AGENT_IMPACT_THRESHOLD: ${{ vars.AGENT_IMPACT_THRESHOLD }}

          # Repository secrets (Settings -> Secrets and variables -> Actions).
          # Only the LLM key for your configured provider is required, plus at
          # least one delivery channel.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
