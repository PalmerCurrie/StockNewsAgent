# Stock News Agent configuration.
#
# Secrets are never stored here -- they are read from environment variables
# (or a local .env). See .env.example for the full list.
#
# Any key below can also be overridden with an AGENT_<KEY> environment
# variable, e.g. AGENT_IMPACT_THRESHOLD=8 or AGENT_LLM_MODEL=gpt-5-mini.
# The environment always wins over this file.

# Used for active hours and for the timestamps printed in the alert.
timezone: America/New_York

# Your tickers. Relative paths resolve against this config file's directory.
watchlist_file: watchlist.yaml

# --- What counts as news worth sending ------------------------------------

lookback_window_hours: 24 # how far back to look for stories
price_window_hours: 2 # window used to compute the price move shown in the alert
impact_threshold: 6 # 1-10; an event must score at least this to be sent
benchmark_index: SPY # the index each move is compared against

# An event must match one of these AND clear impact_threshold. "other" is
# included on purpose: it is where the model puts M&A, litigation, executive
# changes and guidance cuts, which are routinely the most market-moving news
# there is. On a measured sample run 55% of events landed in "other" -- with it
# excluded, a 9/10 acquisition was silently discarded. impact_threshold is the
# filter that should be doing this work. Drop "other" if you want only the
# structured event types.
high_impact_categories:
  - earnings_release
  - regulatory_ruling
  - product_launch
  - analyst_rating_change
  - macroeconomic_announcement
  - other

news_sources:
  - yfinance
  - google_news
  - finviz
  # - yahoo_rss

# --- LLM -------------------------------------------------------------------

# Provider is inferred from the model name ("claude-*" -> anthropic,
# "gpt-*" -> openai); set llm_provider explicitly to override.
llm_model: claude-haiku-4-5
llm_provider: anthropic

# Anthropic Opus/Sonnet tiers only -- thinking depth and token spend
# (low | medium | high | xhigh | max). Haiku does not accept this parameter and
# it is skipped automatically; it applies if you move to Sonnet or Opus.
llm_effort: medium

# Caps thinking + response text together on Claude models. Too low and
# responses truncate mid-answer.
llm_max_output_tokens: 8000

# --- Delivery --------------------------------------------------------------

# At least one. Credentials come from the environment; see .env.example.
channels:
  - type: telegram
  # - type: discord
  # - type: email

# A safety net, not a schedule -- it only stops a run that fires at a silly
# hour. Checked at the START of a run. See "Scheduling" in the README for how
# runs are actually triggered.
active_hours_start: "08:30"
active_hours_end: "22:00"

# Optional. Holds an alert that lands inside this window and merges it into the
# next one, so an overnight run does not wake you. Leave null if the times you
# run at already encode when you want to be pinged.
quiet_hours: null

# --- State -----------------------------------------------------------------

# Remembers which stories were already alerted on and already analyzed, so the
# 24h lookback does not re-send or re-bill the same news every run.
#
#   sqlite  one local file. The default; nothing to sign up for.
#   redis   for hosts with no persistent disk (e.g. GitHub Actions runners).
#           Set STATE_STORE_REDIS_URL. Install with: pip install redis
#   memory  tests only -- disables cross-run dedup.
state_store:
  type: sqlite
  path: ./agent_state.db

already_alerted_ttl_hours: 168 # a story stays "already sent" for a week

# --- Cost ------------------------------------------------------------------

cost:
  max_input_tokens_per_run: 100000
  daily_cost_cap_usd: 1.00
  # USD per 1M tokens. A model missing from this table is logged at startup and
  # its spend cannot be capped, so keep the model you actually use listed here.
  model_pricing:
    claude-opus-5:
      input_per_1m_usd: 5.00
      output_per_1m_usd: 25.00
    claude-sonnet-5:
      input_per_1m_usd: 3.00
      output_per_1m_usd: 15.00
    claude-haiku-4-5:
      input_per_1m_usd: 1.00
      output_per_1m_usd: 5.00
    gpt-4o-mini:
      input_per_1m_usd: 0.15
      output_per_1m_usd: 0.60
